[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "signal-sqlite"
version = "0.1.0"
description = "Extract Signal local backup snapshots into searchable SQLite and attachments"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Jonathan Glanz", email = "jonathan.glanz@gmail.com" }]
maintainers = [{ name = "Jonathan Glanz", email = "jonathan.glanz@gmail.com" }]
keywords = ["signal", "backup", "sqlite", "export", "messenger"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Communications :: Chat",
  "Topic :: Database",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "click>=8.5.1,<9",
  "cryptography>=50.0.2,<51",
  "protobuf>=7.36.2,<8",
  "textual>=8.2.8,<9",
]

[project.urls]
Homepage = "https://github.com/jglanz/signal-sqlite"
Source = "https://github.com/jglanz/signal-sqlite"
Issues = "https://github.com/jglanz/signal-sqlite/issues"

[project.scripts]
signal-sqlite = "signal_sqlite.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_sqlite"]

[tool.hatch.build.targets.sdist]
include = [
  "src/signal_sqlite",
  "tests",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"
python = "3.12"
dependencies = ["pytest>=9,<10", "ruff>=0.14", "grpcio-tools>=1.85.1,<2"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check ."
format-check = "ruff format --check ."
check = ["lint", "format-check", "test"]
proto = "python -m grpc_tools.protoc --proto_path=src/signal_sqlite/_proto --python_out=src/signal_sqlite/_proto src/signal_sqlite/_proto/Backups.proto src/signal_sqlite/_proto/LocalBackup.proto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/signal_sqlite/_proto/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
